  Download the X-Piratez archive via the forum link (the main one) or from moddb.com (alternatively.):
    Загрузите
    архив с X-Piratez по ссылке на форуме (основная) или с moddb.com (альтернативная).
  ? Unzip the archive to a NEW folder. It strongly recommended not merging the contents
    with your existing Dioxine_XPiratez folder, as this can lead to various problems.
  : Распакуйте архив в ОТДЕЛЬНУЮ папку. Настоятельно не рекомендуем выполнять слияние
    с уже существующей вашей папкой Dioxine_XPiratez, поскольку это может привести к
    различным проблемам.
  You need your files of the original UFO: Для запуска необходимы файлы оригинальной
    игры UFO
  Enemy Unknown or X-Com: Enemy Unknown или X-Com
  UFO Defense game (either DOS or Steam version) to launch the mod. Copy them to the Dioxine_XPiratez\UFO folder.:
    UFO
    Defense (DOS или Steam версия). Скопируйте их в папку Dioxine_XPiratez\UFO.
  ? X-Piratez is distributed with the compatible OXCE engine version. There is no need
    to replace or upgrade OXCE, as other builds may not be compatible with your version
    of X-Piratez. Because of that, we recommend you turn off the 'Automatic update check'
    user option (options\advanced\general.) This option does not check for updates of
    the mod itself, in any case it has to be downloaded from the forum or moddb.com
  : X-Piratez распространяется в комплекте с движком OXCE совместимой версии. Не нужно
    заменять или обновлять OXCE, так как другие сборки могут быть несовместимы с текущей
    версией X-Piratez. По этой причине рекомендуем выключить в игре опцию 'Автопроверка
    обновлений' (параметры\дополнительно\общие). Эта опция не проверяет обновления самого
    мода, его в любом случае придется скачивать с форума или moddb.com
  ? X-Piratez is distributed with the compatible OXCE engine version. There is no need
    to replace or upgrade OXCE, as other builds may not be compatible with your version
    of X-Piratez. Because of that, we recommend you turn off the 'Automatic update check'
