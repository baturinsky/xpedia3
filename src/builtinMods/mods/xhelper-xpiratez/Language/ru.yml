  tip_hitMissSound: hitMissSound<br><br>Номер звука из библиотеки BATTLE.CAT, который
    воспроизводится, если Вуду-атака (паника, контроль разума и т. п.) не была успешной.
    Можно указать список возможных вариантов.
  tip_LOSRequired: LOSRequired<br><br>Нужна ли прямая видимость для использования этого
    предмета? (только для ментальных зондов и жезлов Вуду)
  tip_psiLabs: psiLabs<br><br>Количество учебных мест для бойцов, которые могут заниматься
    здесь тренировками Вуду.
  tip_rightClickActionType: rightClickActionType<br><br>Какой экран откроется если применить
    к этому сооружению правый клик? <ul><li> 0 = значение OpenXcom по умолчанию;</li>
    <li> 1 = тюремный блок;</li> <li> 2 = производство;</li> <li> 3 = исследования;</li>
    <li> 4 = боевые тренировки;</li> <li> 5 = тренировки Вуду;</li> <li> 6 = кубрик;</li>
    <li> 7 = рынок;</li> <li> иные значения = глобус.</li></ul>
  STR_VANCOUVER_UFOPEDIA: Крупный, но все равно нудный и сонный город, насколько это
    вообще возможно себе представить. Более-менее оживленно здесь бывает только в порту,
    особенно если на берег за добычей выберутся Глубинники. Но здесь и они почему-то
    становятся вялыми и заторможенными, не показывая свою легендарную свирепость, а
    местный гарнизон так же скучно и без изюминки их отстреливает. Происходят такие
    нашествия примерно три-четыре раза в год.<br/>Так здесь и живут.
  STR_CARACAS_UFOPEDIA: Во всей Революции не найти более тихого места.<br/>Эта башня
    - огромная крипта, где миллионы душ безмолвно томятся и не спускают глаз со случайных
    путников. Впрочем, здесь есть и живые местные жители, которые ухаживают за этим
    исполинским монументом и составляют призракам компанию. Город выбивается из общего
    патриотичного настроя Революции, но только потому, что местные вожди боятся растревожить
    этот огромный бестелесный муравейник. Если хотя бы один голос их разозлит - миллионы
    ответят так, что в Революции больше никогда не будет военных парадов.
  STR_LONDON_UFOPEDIA: "Спектрал - город света, город врат. В общем-то не самое плохое
    место для жизни, если привыкнуть в ежедневной возможности умереть, а также к грохоту
    пушек и пронзительным паровозным гудкам. Кроме того, можно завести себе заводного
    дворецкого, который будет убираться в доме, ходить по магазинам и притаскивать тебя
    пьяного домой из паба.<br/>Только надо позаботиться, чтобы он принес тебя именно
    домой, а не в какую-нибудь западню вроде портала или пристрелянной огневой точки.
    А еще здесь очень красиво: все эти латунные плетения, шестеренки, диковинные механизмы
    - не город, а шкатулка музыкальная. Особенно когда из порталов ничего не лезет,
    а вы не обращаете внимание на трущобы, где живут те, кому повезло меньше, вынужденные
    вращать эти шестеренки."
  STR_JAKARTA_UFOPEDIA: "Чтобы вы не питали иллюзий: дворцом здесь называется огромная
    развалюха в центре города, который сам целиком состоит из таких же развалюх калибром
    поменьше. Зато свободы хоть отбавляй: в городе царит полная анархия, что вполне
    обычно для поселений в Пиратских Проливах. Сказать, что здесь каждый сам за себя,
    все же преувеличение, но уровень организованности не поднимается выше ватаг типа
    'двор на двор'. С другой стороны, если вас много и вы сами хорошо организованы,
    то все будет хорошо, вряд ли<br/>кто-то рискнет с вами связываться."
  STR_CANBERRA_UFOPEDIA: Казалось бы, для такой страны, как Долина Смерти, тайная<br/>арена
    - это оксюморон. Данная же Тайная Арена - оксюморон вдвойне, так как это целый город,
    построенный вокруг тайной арены. В общем, хрен этих жителей Долины поймешь. А арена
    тайная потому, что в боях на ней в ходу магия, энергетическое оружие и другие запрещенные
    приемчики.
