    граната;</li><li>5 = сенсорная граната;</li><li>6 = мед-комплект;</li><li>7
    = сканер движения;</li><li>8 = ментальный зонд;</li><li>9 =
    пси-усилитель;</li><li>10 = осветитель;</li><li>11 = труп.</li></ul>
  tip_bigSprite: bigSprite<br><br>Номер спрайта из BIGOBS.PCK, которым этот
    предмет рисуется в инвентаре юнита и в энциклопедии.
  tip_blastRadius: "blastRadius<br><br>Радиус взрыва: -1 = вычисляется
    автоматически из мощности и типа урона, 0 = взрыва нет, 1 и выше =
    фиксированный радиус в клетках. В OXCE устарел в пользу
    damageAlter.FixRadius."
  tip_blockBothHands: blockBothHands<br><br>Если ДА, то пользоваться этим
    предметом нельзя, пока персонаж что-либо держит в другой руке.
  tip_bulletSpeed: bulletSpeed<br><br>Насколько быстрее (или медленнее, если
    значение отрицательное) летит выпущенный этим оружием снаряд по сравнению со
