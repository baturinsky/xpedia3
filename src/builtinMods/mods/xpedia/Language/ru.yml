  tip_bulletSprite: bulletSprite<br><br>Номер спрайта, которым рисуется снаряд
    этого оружия в тактической миссии.<ul><li>0 = Ракетная установка;</li><li>1
    = Пистолет;</li><li>2 = Винтовка;</li><li>3 = Автопушка;</li><li>4 = Тяжёлая
    пушка;</li><li>5 = Лазерный пистолет;</li><li>6 = Лазерная
    винтовка;</li><li>7 = Тяжёлый лазер;</li><li>8 = Плазма;</li><li>9 =
    Парализующая установка;</li><li>10 = Бластерная установка.</li></ul>
  tip_categories: categories<br><br>Список категорий, которым этот предмет принадлежит.
  tip_clipSize: clipSize<br><br>Количество патронов или их аналогов, содержащихся
    в одном магазине или его аналоге. Неограниченное количество = -1.
  tip_closeQuartersMultiplier: closeQuartersMultiplier<br><br>То же, что
