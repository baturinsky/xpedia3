  tip_arcingShot: arcingShot<br><br>Стреляет ли это оружие по навесной траектории?
  tip_attraction: attraction<br><br>Насколько вероятно, что пришелец поднимет этот
    предмет. Значения ниже 5 игнорируются (так задумано).
  tip_autoRange: autoRange<br><br>Максимально возможная дальность стрельбы
    очередью, на которой не будет штрафов к точности.
  tip_autoShots: autoShots<br><br>Сколько выстрелов делает это оружие в режиме очереди.
  tip_battleType: battleType<br><br>Определяет поведение предмета в тактической
    миссии.<ul><li>0 = нет (предмет только для глобуса);</li><li>1 = стрелковое
