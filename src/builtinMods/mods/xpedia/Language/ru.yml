  tip_costPrime: costPrime<br><br>Задаёт стоимость активации предмета.
    Положительные числа вычитаются, отрицательные — прибавляются.
  tip_costSell: costSell<br><br>Сумма денег, необходимая для совершения сделки.
  tip_costSnap: costSnap<br><br>Задаёт стоимость выстрела навскидку. Положительные
    числа вычитаются, отрицательные — прибавляются.
  tip_costThrow: costThrow<br><br>Задаёт стоимость метания предмета. Положительные
    числа вычитаются, отрицательные — прибавляются.
  tip_costUnprime: costUnprime<br><br>Задаёт стоимость дезактивации предмета.
    Положительные числа вычитаются, отрицательные — прибавляются.
  tip_costUse: costUse<br><br>Задаёт стоимость применения предмета или навыка.
