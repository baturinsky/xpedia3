    цели.
  tip_ToTile: ToTile<br><br>Сколько первичного урона (базовое значение,
    скорректированное алгоритмом расчета) наносится полу, стенам и объектам.
  tip_ToTime: ToTime<br><br>В каком количестве от первичного урона (базовое
    значение, скорректированное алгоритмом расчета) снижаются очки действия цели
    до начала ее следующего хода.
  tip_ToWound: ToWound<br><br>Определяет, сколько фатальных ран будет нанесено в
    соответствии с формулой. Значение '1.0' соответствует правилам оригинального
