  tip_ToEnergy: ToEnergy<br><br>В каком количестве от первичного урона (базовое
    значение, скорректированное алгоритмом расчета) снижаются очки выносливости
    (энергия) цели.
  tip_ToHealth: ToHealth<br><br>Сколько первичного урона (базовое значение,
    скорректированное алгоритмом расчета) наносится здоровью цели.
  tip_ToItem: ToItem<br><br>Сколько первичного урона (базовое значение,
    скорректированное алгоритмом расчета) наносится лежащим на полу предметам.
  tip_ToMorale: ToMorale<br><br>Какая доля первичного урона (мощность x
