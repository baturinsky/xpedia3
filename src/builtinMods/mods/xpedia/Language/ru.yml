  tip_accuracyAimed: accuracyAimed<br><br>Процентный модификатор, применяемый к
    точности стрельбы персонажа во время прицельного выстрела.
  tip_accuracyAuto: accuracyAuto<br><br>Процентный модификатор, применяемый к
    точности стрельбы персонажа при стрельбе очередью.
  tip_accuracyCloseQuarters: accuracyCloseQuarters<br><br>Базовая точность (в
