  tip_accel: "accel<br><br>Определяет скорость, с которой судно попытается выйти
    из боя (если возможно): <ul><li> 0-2 = 50% обычной скорости;</li> <li> 3-5 =
    обычная скорость;</li> <li> 6-8 = +50% к обычной скорости;</li> <li> 9+ =
    двойная скорость.</li></ul>"
  tip_allowLanding: allowLanding<br><br>Можно ли на этом судне отправиться на тактическую миссию?
  tip_autoPatrol: autoPatrol<br><br>Должно ли это судно автоматически возвращаться
    к точке патрулирования после заправки?
  tip_avoidBonus: avoidBonus<br><br>Фиксированный процент, на который изменяется
    шанс уклониться от вражеского огня.
  tip_costRent: costRent<br><br>Сумма, ежемесячно списываемая за аренду судна.
    Если указано 0, судно не арендуется и не учитывается в содержании убежища.
  tip_damageMax: damageMax<br><br>Максимальный урон, который может выдержать
    судно. Получив 50% этого урона, судно совершает аварийную посадку; получив
    100%, оно уничтожается.
  tip_fixedWeapons: fixedWeapons<br><br>Список оружия, которое предустановлено на
    это судно без возможности замены на другое.
  tip_forceShowInMonthlyCosts: forceShowInMonthlyCosts<br><br>Всегда показывает
    это судно в отчете по месячным затратам, даже если оно не приписано к
    убежищу.
  tip_fuelMax: fuelMax<br><br>Максимальный объем топливного бака. Темп расхода
    топлива прямо пропорционален скорости судна.
  tip_hitBonus: hitBonus<br><br>Фиксированный процент, на который изменяется шанс
    попадания по цели для всех установленных орудий. В X-Piratez значение по
    умолчанию для всех судов установлено 15 (считается как 0).
  tip_maxAltitude: maxAltitude<br><br>Предел высоты (0-4), на которую судно может
    подняться для перехвата.
  tip_pilots: pilots<br><br>Количество пилотов, необходимых для управления этим
    судном. <ul><li> пилоты - тоже бойцы, они будут участвовать в тактической
    миссии;</li> <li> личные навыки пилотов влияют на поведение судна в
    воздушном бою как в хорошую, так и в плохую сторону;</li> <li> пилоты
    получают опыт за участие в воздушных боях;</li> <li> вы можете сами
    назначить пилотов, в противном случае они будут назначены
    автоматически.</li></ul>
  tip_powerBonus: "powerBonus<br><br>Модификатор мощности бортовых
    орудий.<br><br>Пример: 20 означает, что мощность орудий составляет 120% от
    номинальной, а -20 означает, что она уменьшилась до 80%."
  tip_radarChance: radarChance<br><br>Вероятность (0-100%), с которой система
    обнаружения реагирует на вражеский объект, оказавшийся в зоне покрытия.
  tip_radarRange: radarRange<br><br>Максимальная дистанция, на которой срабатывает
    система обнаружения. Измеряется в морских милях.
  tip_refuelItem: refuelItem<br><br>Предмет, необходимый для заправки этого судна.
    Если предмет не указан, судно использует обычное топливо.
  tip_refuelRate: refuelRate<br><br>Количество топлива, заливаемого в бак каждые
    30 минут заправки в убежище. Если указан refuelItem, он расходуется при
    каждом таком пополнении.
  tip_repairRate: repairRate<br><br>Количество повреждений, устраняемых ежечасно
    во время ремонта в убежище.
  tip_score: "score<br><br>Рейтинг, который приносит этот объект.<ul><li>Судно:
    рейтинг, который теряется при его уничтожении.</li><li>НЛО: рейтинг,
    начисляемый при аварийной посадке, и вдвое больший — при
    уничтожении.</li></ul>"
  tip_shieldBleedThrough: shieldBleedThrough<br><br>Процент урона, который
    получает судно от попадания, уничтожающего силовой щит. При нулевом значении
    этого параметра даже 1 ед. мощности щита полностью предотвратит любой урон.
    Если же выставлено 100, то сначала щит поглотит столько урона, сколько
    сможет, а 100% оставшегося урона получит судно.
  tip_shieldCapacity: shieldCapacity<br><br>Максимальное значение заряда силового щита.
  tip_shieldRecharge: "shieldRecharge<br><br>Вероятность в воздушном бою
    восстановить 1 ед. мощности силового щита за 1 секунду времени игры.
    Значения ниже 100 - это проценты. Если указано значение, превышающее 100, то
    каждая сотня - это восстановление мощности щитов на 1 за 1 секунду времени
    игры.<br><br>Пример: восстановление щита = 250 означает, что каждую игровую
    секунду восстанавливается 2 ед. мощности силового щита, а также с
    вероятностью 50% еще 1 ед."
  tip_shieldRechargeInGeoscape: shieldRechargeInGeoscape<br><br>Аналогично
    восстановлению щита в бою, но срабатывает каждые 5 секунд времени игры. Если
    задано -1, то по истечении первых 5 секунд времени игры щит восстановится
    полностью, как бы истощен он ни был.
  tip_soldiers: soldiers<br><br>Сколько бойцов и техники (в сумме) может взять на
    борт это судно.
  tip_spacecraft: spacecraft<br><br>Может ли это судно достичь Кидонии?
  tip_speedMax: speedMax<br><br>Измеряется в морских милях в час.<br><br>Судно
    игрока в режиме патрулирования имеет скорость, равную половине максимальной,
    и максимальную - во всех остальных случаях.
  tip_sprite: sprite<br><br>Номер спрайта в наборе, заданном рулсетом. Суда читают
    BASEBITS.PCK (со смещениями INTICON.PCK sprite+0 и sprite+11), бортовые
    орудия — BASEBITS.PCK (sprite+48) и INTICON.PCK (sprite+5), а НЛО —
    INTERWIN.DAT. Для НЛО предпочтителен modSprite.
  tip_undetectable: undetectable<br><br>Может ли этот объект быть обнаружен
    вражескими базами и судами-охотниками?
  tip_vehicles: vehicles<br><br>Количество техники, которое может взять на борт
    это судно. В OXCE сюда входят и бойцы 2х2; до версии 7.10 значение -1
    означало неограниченно.
  tip_weaponStrings: weaponStrings<br><br>Список, описывающий слоты вооружения
    судна (до 4 слотов).
  tip_weaponTypes: weaponTypes<br><br>Список, определяющий совместимые с этим
    судном классы орудий. До 4 позиций, и на каждую позицию можно назначить до 4
    совместимых классов орудий.
  tip_weapons: weapons<br><br>Количество слотов бортовых орудий или модулей у
    этого судна. Классический интерфейс показывает не более 2; OXCE поддерживает
    до 4.
  tip_ammoMax: ammoMax<br><br>Максимальное количество боеприпасов, которое может
    нести это орудие.
  tip_clip: clip<br><br>Предмет, требующийся для перезаряжания орудия.
  tip_launcher: launcher<br><br>Предмет, необходимый для установки этого орудия.
  tip_projectileSpeed: projectileSpeed<br><br>Скорость снаряда в воздушном бою.
  tip_projectileType: projectileType<br><br>Тип снаряда орудия, определяющий его
    спрайт в воздушном бою:<ul><li>0 = Скат;</li><li>1 = Лавина;</li><li>2 =
    Авиапушка;</li><li>3 = Бластерный снаряд;</li><li>4 = Лазерная
    авиапушка;</li><li>5 = Плазменная пушка.</li></ul>
  tip_rearmRate: rearmRate<br><br>Количество боеприпасов, восстанавливаемое каждые
    30 минут, пока судно перевооружается в базе. Если у орудия есть магазин,
    магазины расходуются согласно их clipSize; rearmRate должен быть кратен
    clipSize.
  tip_reloadAggressive: reloadAggressive<br><br>Время между выстрелами этого
    орудия в режиме агрессивной атаки.
  tip_reloadCautious: reloadCautious<br><br>Время между выстрелами этого орудия в
    режиме осторожной атаки.
  tip_reloadStandard: reloadStandard<br><br>Время между выстрелами этого орудия в
    режиме стандартной атаки.
  tip_shieldDamageModifier: shieldDamageModifier<br><br>Процент урона, который
    орудие наносит силовым щитам цели.
  tip_sound: sound<br><br>Номер звука из библиотеки GEO.CAT, который
    воспроизводится в момент выстрела орудия.
  tip_weaponType: weaponType<br><br>Ограничивает, какие орудия и агрегаты можно
    устанавливать в определённые слоты бортового вооружения.
  tip_alertSound: alertSound<br><br>Номер звука из библиотеки GEO.CAT, который
    воспроизводится в момент обнаружения этого судна.
  tip_breakOffTime: breakOffTime<br><br>Минимальное время, по истечении которого
    судно попытается выйти из воздушного боя.
  tip_craftCustomDeploy: craftCustomDeploy<br><br>Особые правила генерации
    тактической миссии, когда это судно терпит крушение или приземляется.
  tip_huntAlertSound: huntAlertSound<br><br>Номер звука из GEO.CAT, который
    воспроизводится, когда судно этого типа начинает охоту на ваши суда.
  tip_huntBehavior: huntBehavior<br><br>Алгоритм принятия решения о выходе из
    воздушного боя:<ul><li>0 = попытается сбежать, если проигрывает;</li><li>1 =
    никогда не отступает и не совершает аварийную посадку (вместо этого
    уничтожается);</li><li>2 = случайный вариант (0 или 1), выбранный при
    появлении.</li></ul>
  tip_huntMode: huntMode<br><br>Алгоритм выбора приоритетных целей:<ul><li>0 =
    предпочитает охотиться на ваши перехватчики;</li><li>1 = предпочитает
    охотиться на ваши транспорты;</li><li>2 = случайный вариант (0 или 1),
    выбранный при появлении.</li></ul>
  tip_hunterKillerPercentage: hunterKillerPercentage<br><br>Вероятность (0-100%)
    стать судном-охотником в момент появления.
  tip_marker: marker<br><br>Номер спрайта из спрайт-листа GlobeMarkers, отвечающий
    за отображение на глобусе обнаруженного движущегося судна или иного объекта.
  tip_markerCrash: markerCrash<br><br>Номер спрайта из спрайт-листа GlobeMarkers,
    отвечающий за отображение на глобусе потерпевшего крушение судна или иного
    объекта.
  tip_markerLand: markerLand<br><br>Номер спрайта из спрайт-листа GlobeMarkers,
    отвечающий за отображение на глобусе приземлившегося судна или иного
    остановившегося объекта.
  tip_missilePower: missilePower<br><br>Имеет смысл только для судов, посланных с
    ответным ударом. Если такое судно не сбить во время обороны убежища, оно
    уничтожит часть сооружений или даже всё убежище (без тактической
    миссии!).<ul><li>-1 = уничтожить всё;</li><li>0 = отключено (не
    ракета);</li><li>N = уничтожить N сооружений 1х1 или эквивалентную
    площадь.</li></ul>
  tip_missionCustomDeploy: missionCustomDeploy<br><br>Особые правила генерации
    тактической миссии, когда активность этого судна приводит к появлению этой
    миссии.
  tip_missionScore: missionScore<br><br>Количество очков, которые вычитаются из
    месячного рейтинга каждые 30 минут времени игры, пока судно находится в
    воздухе. На период, когда судно приземляется для выполнения своей миссии,
    это число удваивается.
  tip_modSprite: modSprite<br><br>Спрайт, которым это судно рисуется в воздушном
    бою и в энциклопедии.
  tip_raceBonus: raceBonus<br><br>Изменяет или переопределяет характеристики судна
    в зависимости от экипажа.
  tip_range: range<br><br>Максимальная дальность поражения бортового орудия в
    воздушном бою.
  tip_reload: reload<br><br>Интервал между выстрелами орудий судна.
  tip_sightRange: sightRange<br><br>Радиус, в котором это судно или сооружение
    может обнаружить вражеские убежища (в морских милях).
  tip_unmanned: Беспилотные вражеские суда (ракеты, дроны и т. п.) не могут
    совершить аварийную посадку после воздушного боя, и их нельзя принудительно
    посадить притягивающим лучом. Они сражаются до 0% прочности (а не до 50%,
    как обычные суда).
  tip_armor: "armor<br><br><ul><li>Для предметов: сколько урона нужно нанести
    лежащему на земле предмету, чтобы уничтожить его.</li><li>Для НЛО: сколько
    урона поглощается при каждом попадании.</li><li>Для юнитов и бойцов:
    строковый ID брони, которую они носят по умолчанию.</li></ul>"
  tip_stats: "stats<br><br><ul><li>Для юнитов: боевые характеристики этого
    юнита.</li><li>Для брони: бонусы к характеристикам, которые носитель
    получает сверх собственных.</li><li>Для бортовых орудий и модулей: изменения
    характеристик судна, пока они установлены.</li></ul>"
  tip_allowInv: allowInv<br><br>Может ли игрок увидеть инвентарь персонажа,
    использующего эту броню?
  tip_allowsKneeling: allowsKneeling<br><br>Можно ли в этой броне присесть?
  tip_allowsMoving: allowsMoving<br><br>Можно ли в этой броне перемещаться?
  tip_allowsRunning: allowsRunning<br><br>Можно ли в этой броне бегать?
  tip_allowsStrafing: allowsStrafing<br><br>Можно ли в этой броне двигаться боком,
    не меняя направления взгляда?
  tip_alwaysVisible: alwaysVisible<br><br>Если ДА, то игрок всегда видит того, кто
    носит эту броню.
  tip_antiCamouflageAtDark: "antiCamouflageAtDark<br><br>Снимает камуфляж
    противника на указанную величину (в клетках) в тёмное время суток. Не может
    увеличить видимость сверх обычной. Соответствует параметру
    SPOT.<br><br>Пример: у наблюдателя SPOT=5, для него противник с INVIS=6
    будет иметь INVIS=11, а противник с CAMO=-7 будет иметь CAMO=-2.
    Эффективность CAMO=-4 примет значение CAMO=0."
  tip_antiCamouflageAtDay: "antiCamouflageAtDay<br><br>Снимает камуфляж противника
    на указанную величину (в клетках) в светлое время суток. Не может увеличить
    видимость сверх обычной. Соответствует параметру SPOT.<br><br>Пример: у
    наблюдателя SPOT=5, для него противник с INVIS=6 будет иметь INVIS=11, а
    противник с CAMO=-7 будет иметь CAMO=-2. Эффективность CAMO=-4 примет
    значение CAMO=0."
  tip_bleedImmune: bleedImmune<br><br>Есть ли у этого персонажа иммунитет к кровотечению?
  tip_builtInWeapons: builtInWeapons<br><br>Альтернативный способ задать
    встроенное оружие пришельцев и гражданских вместо перечисления его у самого
    юнита. Работает и для бойцов. Заменён параметром builtInWeaponSets.
  tip_camouflageAtDark: camouflageAtDark<br><br>Делает носителя этой брони менее
    заметным в тёмное время суток.<br><br>Положительное число задаёт абсолютную
    дистанцию (например, 7 означает, что юнит виден с 7 клеток) и соответствует
    параметру INVIS.<br><br>Отрицательное число задаёт относительную дистанцию
    (например, -10 означает, что юнит виден с расстояния на 10 клеток меньшего,
    чем обычно) и соответствует параметру CAMO.<br><br>Не может уменьшить
    видимость ниже 1 клетки.
  tip_camouflageAtDay: camouflageAtDay<br><br>Делает носителя этой брони менее
    заметным в светлое время суток.<br><br>Положительное число задаёт абсолютную
    дистанцию (например, 7 означает, что юнит виден с 7 клеток) и соответствует
    параметру INVIS.<br><br>Отрицательное число задаёт относительную дистанцию
    (например, -10 означает, что юнит виден с расстояния на 10 клеток меньшего,
    чем обычно) и соответствует параметру CAMO.<br><br>Не может уменьшить
    видимость ниже 1 клетки.
  tip_constantAnimation: constantAnimation<br><br>Установите true для юнитов,
    которые постоянно проигрывают анимацию, например для биодрона, целатида и
    силакоида. Анимация идёт, пока юнит стоит без движения.
  tip_corpseBattle: corpseBattle<br><br>Список строковых ID предметов-трупов,
    которые появляются, когда юнит в этой броне погибает или теряет сознание в
    тактической миссии.
  tip_corpseGeo: corpseGeo<br><br>Предмет-труп, получаемый в итогах миссии.
  tip_createsMeleeThreat: createsMeleeThreat<br><br>Способен ли этот юнит на CQC
    (бой на короткой дистанции)?
  tip_deathFrames: deathFrames<br><br>Количество спрайтов, задействованных в
    анимации смерти персонажа.
  tip_drawBubbles: drawBubbles<br><br>Для персонажей, которые дышат под водой.
  tip_drawingRoutine: drawingRoutine<br><br>Алгоритм, по которому собираются части
    тела юнита из его spriteSheet:<ul><li>0 = боец, сектоид;</li><li>1 =
    летун;</li><li>2 = ТБП;</li><li>3 = кибердиск;</li><li>4 = гражданский,
    эфириал;</li><li>5 = сектопод, жнец;</li><li>6 = человекозмей;</li><li>7 =
    криссалид;</li><li>8 = силакоид;</li><li>9 = целатид;</li><li>10 =
    мутон;</li><li>11 = подводная система вооружения;</li><li>12 =
    галлюциноид;</li><li>13 = акванавт;</li><li>14 = кальцинит, глубинный,
    гиллмен, лобстермен, тасот;</li><li>15 = акватоид;</li><li>16 =
    биодрон;</li><li>17 = гражданские TFTD типа A и зомби (TFTD);</li><li>18 =
    гражданские TFTD типа B;</li><li>19 = тентакулат;</li><li>20 =
    трисцен;</li><li>21 = ксарквид;</li><li>22 = перевёрнутый кибердиск
    (анимация двигателей сверху).</li></ul>
  tip_fearImmune: fearImmune<br><br>Не теряет ли этот юнит боевой дух (и не
    обнаруживается ли он параметром psiVision)?
  tip_forcedTorso: forcedTorso<br><br>Для спрайтов бойцов предусмотрены как
    женские, так и мужские туловища. В некоторых видах брони может
    использоваться универсальный вариант без различий между женской и мужской
    версиями. <ul><li> 0 = туловище зависит от пола персонажа;</li> <li> 1 =
    всегда мужское туловище;</li> <li> 2 = всегда женское туловище.</li></ul>
  tip_heatVision: heatVision<br><br>Позволяет лучше видеть сквозь дым. Процент
    (0-100%), определяющий, сколько дыма игнорируется.
  tip_ignoresMeleeThreat: ignoresMeleeThreat<br><br>Иммунен ли этот юнит к CQC
    (бою на короткой дистанции)?
  tip_loftempsSet: loftempsSet<br><br>Список ID LOFTEMPS, которыми юнит в этой
    броне представляется в трёхмерном воксельном пространстве (1 запись для
    юнита 1х1, 4 — для 2х2). Из-за ошибки в логике вокселей юнитов для 2х2
    корректно работает только набор [92, 89, 90, 91].
  tip_meleeDodge: meleeDodge<br><br>Формула (сумма слагаемых) шанса уклонения в ближнем бою.
  tip_meleeDodgeBackPenalty: meleeDodgeBackPenalty<br><br>Штраф к способности
    юнита уклоняться в ближнем бою (см. meleeDodge) при атаке со спины. Задаётся
    в процентах, например 0.7 = 70%.<br><br>Со спины штраф действует полностью,
    с флангов он соответственно уменьшается. При атаке в лоб штрафа нет.
  tip_moveSound: moveSound<br><br>Номер звука из библиотеки BATTLE.CAT, который
    воспроизводится, когда персонаж перемещается.
  tip_movementType: "movementType<br><br>Тип перемещения персонажа, надевшего эту
    броню: <ul><li> 0 = ходьба;</li> <li> 1 = полет;</li> <li> 2 = скольжение
    (без анимации ходьбы);</li> <li> 3 = плавание (свободно плавает под водой,
    ходит на поверхности);</li> <li> 4 = донное погружение (ходит по дну под
    водой, летает на поверхности).</li></ul>"
  tip_overKill: overKill<br><br>Сколько урона сверх максимального запаса ОЗ нужно
    нанести, чтобы испарить или дезинтегрировать юнита. Задаётся в процентах,
    например 0.6 = 60% от максимального запаса ОЗ. Дезинтегрированный юнит имеет
    другую анимацию смерти и не оставляет трупа; для оружия можно настроить,
    вызывает ли оно дезинтеграцию.
  tip_painImmune: painImmune<br><br>Иммунен ли этот юнит к оглушающему урону? По
    умолчанию всё оружие с damageType=6 (оглушение) игнорирует этот параметр.
  tip_personalLight: personalLight<br><br>Интенсивность персонального света,
    который излучает дружественный юнит в этой броне.
  tip_psiDefence: psiDefence<br><br>Формула (сумма слагаемых) для значения защиты от пси-атак.
  tip_psiVision: psiVision<br><br>Позволяет 'видеть' сквозь стены. Носитель этой
    брони чувствует противников на расстоянии до psiVision клеток.<br><br>Не
    позволяет чувствовать противников с параметром fearImmune.
  tip_specialWeapon: specialWeapon<br><br>Встроенное оружие, которое не занимает
    ячейки инвентаря. Вместо этого доступ к нему осуществляется через
    специальную иконку.
  tip_spriteSheet: spriteSheet<br><br>Набор спрайтов, которые соединяются друг с
    другом для отрисовки персонажа, использующего эту броню.
  tip_storeItem: storeItem<br><br>Предмет, которым эта броня представлена на
    складе убежища для экипировки.
  tip_turnBeforeFirstStep: turnBeforeFirstStep<br><br>Если ДА, то к стоимости
    первого шага будет прибавляться время на поворот в том направлении, куда
    требуется шагнуть.
  tip_turnCost: turnCost<br><br>Сколько ОД затрачивается для поворота на 45 градусов.
  tip_units: units<br><br>Категории бойцов, которые могут носить эту броню.
  tip_visibilityAtDark: visibilityAtDark<br><br>Дальность обзора в темное время
    суток, измеряемая в клетках.
  tip_visibilityAtDay: visibilityAtDay<br><br>Дальность обзора в светлое время
    суток, измеряемая в клетках.
  tip_zombiImmune: "zombiImmune<br><br>Есть ли у этого юнита иммунитет к
    зомбированию? Значение по умолчанию зависит от размера: false для юнитов
    1х1, true для 2х2. Работает только для юнитов 1х1; юниты 2х2 всегда обладают
    этим иммунитетом."
  tip_cost: "cost<br><br><ul><li>Исследования: количество человеко-дней на
    завершение проекта (фактическое время составит 50-150% от
    этого).</li><li>Производство: деньги, списываемые за каждую выпущенную
    единицу.</li></ul>Обратите внимание, что это два разных числа."
  tip_ArmorEffectiveness: ArmorEffectiveness<br><br>Насколько эффективна броня
    цели против этого типа урона (модификатор одновременно применяется к броне
    спереди, с боков, сзади и снизу).<br><br>Примеры:<ul><li>0.0 = броня
    полностью игнорируется;</li><li>0.4 = при вычислении итогового урона броня
    примет значение на 60% ниже фактического;</li><li>1.0 = вычисление итогового
    урона по фактическим значениям брони;</li><li>1.33 = при вычислении
    итогового урона броня примет значение на 33% выше фактического.</li></ul>
  tip_FireBlastCalc: FireBlastCalc<br><br>В оригинальном X-Com воспламенение от
    взрыва вычислялось по особой формуле, которую при желании можно
    задействовать.
  tip_FireThreshold: FireThreshold<br><br>Сколько урона должен получить юнит или
    объект, чтобы воспламениться.
  tip_FixRadius: FixRadius<br><br> <ul><li> -1 = динамический, зависит от мощности
    взрыва;</li> <li> 0 = отсутствует;</li> <li> 1+ = фиксированный,
    соответствует указанному числу клеток.</li></ul>
  tip_IgnoreDirection: IgnoreDirection<br><br>Нужно ли при вычислении урона
    игнорировать направление, с которого снаряд попал по цели? Используется, как
    правило, для дыма и огня.
  tip_IgnoreOverKill: IgnoreOverKill<br><br>Отключает возможность нанесения цели
    дезинтегрирующего урона (когда при единовременном получении огромного урона
    цель полностью уничтожается).
  tip_IgnorePainImmunity: IgnorePainImmunity<br><br>Некоторые персонажи
    невосприимчивы к боли/оглушению. Этот параметр позволяет оружию игнорировать
    эту невосприимчивость (характерно для оружия с ошеломляющим уроном).
  tip_IgnoreSelfDestruct: IgnoreSelfDestruct<br><br>У убитой цели не сработает
    система самоуничтожения (как у Кибердиска). Параметр характерен для урона в
    ближнем бою, а также ошеломляющего урона и взрывов.
  tip_RadiusEffectiveness: "RadiusEffectiveness<br><br>Используется, когда радиус
    взрыва динамический (FixRadius = -1). Радиус вычисляется исходя из мощности
    взрыва (в том числе бонусной мощности). Это коэффициент для такого
    расчёта.<br>Пример: при радиусе эффективности 0.1 и мощности взрыва 200
    радиус зоны поражения составит 20 клеток."
  tip_RadiusReduction: RadiusReduction<br><br>На сколько ослабевает мощность
    взрыва по мере удаления от центра.
  tip_RandomHealth: RandomHealth<br><br>Должны ли вычисления выше оперировать
    случайными коэффициентами?
  tip_RandomStun: RandomStun<br><br>Должна ли величина оглушения быть случайной?
  tip_RandomType: <ul><li>0 = расчёт по правилам оригинального X-Com;</li><li>1 =
    разброс 0-200%;</li><li>2 = разброс 50-150%;</li><li>3 = без разброса
    (всегда 100%);</li><li>4 = случайный урон в диапазоне, заданном
    fireDamageRange;</li><li>5 = не наносит урона;</li><li>6 = разброс 0-200% за
    два прохода (сначала определяется 0-100%, потом операция повторяется,
    получившиеся два модификатора складываются);</li><li>7 = разброс
    50-200%.</li></ul>
  tip_RandomWound: RandomWound<br><br>Определяет, сколько фатальных ран будет
    нанесено в соответствии с формулой. Значение 'ДА' соответствует правилам
    оригинального X-Com.
  tip_ResistType: "ResistType<br><br>Тип урона, то есть сопротивление брони цели,
    которое применяется. Значения такие же, как у damageType.<br><br>Пример:
    азотная пушка имеет тип урона «удушающий», что позволяет ей тушить огонь
    (именно тип урона влияет на взаимодействие с окружением), однако тип
    сопротивления — «огненный»: при выстреле из неё по юниту в расчётах
    участвует сопротивление не удушению, а огню."
  tip_SmokeThreshold: SmokeThreshold<br><br>Сколько урона нужно нанести местности,
    чтобы она задымилась.
  tip_ToArmor: ToArmor<br><br>Сколько первичного урона (базовое значение,
    скорректированное алгоритмом расчета) наносится броне (значение брони
