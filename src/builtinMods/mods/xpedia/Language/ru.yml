  tip_costAimed: costAimed<br><br>Задаёт стоимость прицельного выстрела.
    Положительные числа вычитаются, отрицательные — прибавляются.
  tip_costAuto: costAuto<br><br>Задаёт стоимость выстрела очередью. Положительные
    числа вычитаются, отрицательные — прибавляются.
  tip_costBuy: costBuy<br><br>Сумма денег, необходимая для совершения сделки.
  tip_costMelee: costMelee<br><br>Задаёт стоимость атаки в ближнем бою.
