  tip_accuracyMelee: accuracyMelee<br><br>Процентный модификатор, применяемый к
    точности ближнего боя персонажа при рукопашной атаке.
  tip_accuracyMultiplier: accuracyMultiplier<br><br>Формула (сумма слагаемых),
